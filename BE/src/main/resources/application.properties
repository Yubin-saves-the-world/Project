spring.application.name=BE

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/vitality?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.jackson.property-naming-strategy=SNAKE_CASE

vitality.jwt.secret=${JWT_SECRET:local-dev-secret-change-before-deploy-0123456789}
vitality.jwt.expires-in=7d
vitality.policy-version=2026-10-01

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

vitality.mail.enabled=${MAIL_ENABLED:false}
vitality.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@vitality.local}}
vitality.mail.code-ttl=5m
vitality.mail.token-ttl=30m
vitality.mail.resend-interval=60s
vitality.mail.hourly-limit=5
vitality.mail.max-attempts=5
