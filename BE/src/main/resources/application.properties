spring.application.name=BE

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/vitality?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.jackson.property-naming-strategy=SNAKE_CASE

vitality.jwt.secret=${JWT_SECRET:local-dev-secret-change-before-deploy-0123456789}
vitality.jwt.expires-in=7d
vitality.policy-version=2026-10-01

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true

vitality.ai-url=${AI_BASE_URL:http://127.0.0.1:8001}
vitality.storage-dir=${PHOTO_STORAGE_DIR:./data/photos}
vitality.public-url=${PUBLIC_BASE_URL:http://127.0.0.1:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
