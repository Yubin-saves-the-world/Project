<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOVID 사진 분석 연동</title>
<style>body{font:16px system-ui;background:#f4f6fb;color:#19233a;max-width:860px;margin:40px auto;padding:20px}section{background:white;border-radius:16px;padding:24px;margin:20px 0}input,button{font:inherit;padding:12px;margin:5px 0;border:1px solid #cbd3df;border-radius:8px}button{background:#285eea;color:white;cursor:pointer}button:disabled{opacity:.5}img{max-width:100%;max-height:650px;object-fit:contain}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#526078}td{padding:10px}</style>
<h1>MOVID 사진 분석</h1><p>사진 → Spring Boot → FastAPI → MediaPipe·DINOv3 → DB 저장</p>
<section><h2>로그인</h2><p>로컬 demo 계정: demo@movid.local / movid1234</p><input id="email" type="email" value="demo@movid.local" aria-label="이메일"><input id="password" type="password" placeholder="비밀번호" aria-label="비밀번호"><button id="login">로그인</button><p id="auth" role="status"></p></section>
<section><h2>사진 분석</h2><p>머리부터 발끝까지 보이는 한 사람의 정면 사진을 선택하세요.</p><input id="file" type="file" accept="image/jpeg,image/png"><button id="analyze" disabled>분석 시작</button><button id="history" disabled>분석 기록</button><p id="status" role="status"></p><div id="result"></div></section>
<small>사진 기반 참고 결과이며 의료적 진단이 아닙니다. 근육 윤곽 분류기는 아직 학습하지 않았습니다. 의복 가림·다중 인물·정면 여부 자동 검사는 미완료입니다.</small>
<script>
let token=null,busy=false;const $=id=>document.getElementById(id);
async function api(path,options={}){const headers={...(options.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(path,{...options,headers});let data=r.status===204?null:await r.json();if(!r.ok)throw Error(data.message||'요청 실패 ('+r.status+')');return data;}
$('login').onclick=async()=>{try{const data=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});token=data.access_token;$('password').value='';$('auth').textContent='로그인 완료';$('analyze').disabled=false;$('history').disabled=false;}catch(e){$('auth').textContent=e.message;}};
function render(data){const root=$('result');root.replaceChildren();if(data.status==='failed'){root.textContent=(data.error_code||'')+' '+data.error_message;return;}const heading=document.createElement('h3');heading.textContent=data.summary||'분석 결과';root.append(heading);const table=document.createElement('table');const labels={shoulder_tilt_deg:'어깨선 기울기 (도)',pelvis_tilt_deg:'골반 추정점 기울기 (도)',neck_forward_deg:'목 전방 각도',shoulder_hip_ratio:'어깨/골반 비율',torso_leg_ratio:'상체/하체 비율'};for(const [k,label]of Object.entries(labels)){const tr=document.createElement('tr');for(const value of [label,data.measures?.[k]??'평가 불가']){const td=document.createElement('td');td.textContent=value;tr.append(td);}table.append(tr);}root.append(table);for(const part of data.dinov3?.parts||[]){const p=document.createElement('p');p.textContent=part.part+': '+(part.status==='extracted'?'DINOv3 특징 추출 성공 (384차원), 근육 등급 미학습':'평가 불가');root.append(p);}for(const warning of data.warnings||[]){const p=document.createElement('p');p.textContent=warning;root.append(p);}if(data.debug_image_base64){const img=document.createElement('img');img.alt='관절 및 실루엣 검출 결과';img.src='data:image/jpeg;base64,'+data.debug_image_base64;root.append(img);}const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='원본 결과 보기';const copy={...data};delete copy.debug_image_base64;pre.textContent=JSON.stringify(copy,null,2);details.append(summary,pre);root.append(details);}
$('analyze').onclick=async()=>{if(busy)return;const file=$('file').files[0];if(!file){$('status').textContent='사진을 선택해 주세요.';return;}busy=true;$('analyze').disabled=true;try{$('status').textContent='사진 업로드 중';const form=new FormData();form.append('image',file);form.append('type','current');form.append('side','front');const photo=await api('/api/photos',{method:'POST',body:form});const ticket=await api('/api/body-analyses/photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({photo_id:photo.photo_id})});const start=Date.now();while(Date.now()-start<95000){const data=await api('/api/body-analyses/'+ticket.analysis_id);if(data.status!=='pending'){render(data);$('status').textContent=data.status==='done'?'분석 완료 · DB 저장 완료':'분석 실패';return;}$('status').textContent='분석 중 · '+Math.round((Date.now()-start)/1000)+'초';await new Promise(r=>setTimeout(r,2000));}$('status').textContent='처리가 지연되고 있습니다. 분석 기록에서 확인해 주세요.';}catch(e){$('status').textContent=e.message;}finally{busy=false;$('analyze').disabled=false;}};
$('history').onclick=async()=>{try{const data=await api('/api/body-analyses');$('result').replaceChildren();for(const item of data.items){const btn=document.createElement('button');btn.textContent='#'+item.analysis_id+' '+item.status+' '+item.created_at;btn.onclick=async()=>{try{render(await api('/api/body-analyses/'+item.analysis_id));}catch(e){$('status').textContent=e.message;}};$('result').append(btn,document.createElement('br'));}}catch(e){$('status').textContent=e.message;}};
</script></html>
