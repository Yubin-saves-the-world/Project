<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOVID 사진 비교</title>
<style>
body{margin:0;background:#f5f6fb;color:#20283c;font:16px/1.7 system-ui,sans-serif}main{max-width:850px;margin:40px auto;padding:24px}section,form{background:white;border:1px solid #e1e5f0;border-radius:20px;padding:26px;margin:20px 0}h1{font-size:30px}h2{font-size:21px}label{display:block;margin:18px 0}input[type=file]{display:block;margin-top:8px;max-width:100%}button{background:#465df5;color:white;border:0;border-radius:12px;padding:14px 24px;font:inherit;cursor:pointer}button:disabled{opacity:.5}a{color:#465df5}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:12px 6px;border-bottom:1px solid #e6e9f0}#message{white-space:pre-wrap} .scroll{overflow:auto}.muted{color:#657086}
</style>
<main><a href="/">← 홈</a><h1>현재 사진과 목표 사진 비교</h1>
<p>사진에서 측정한 기울기와 비율의 차이를 확인합니다. 이상적인 체형이나 필요한 운동을 판정하지 않습니다.</p>
<form id="form"><h2>비교할 사진</h2>
<label>현재 정면 사진<input name="current_front" type="file" accept="image/jpeg,image/png" required></label>
<label>목표 정면 사진<input name="goal_front" type="file" accept="image/jpeg,image/png" required></label>
<label>현재 측면 사진 · 선택<input name="current_side" type="file" accept="image/jpeg,image/png"></label>
<label>목표 측면 사진 · 선택<input name="goal_side" type="file" accept="image/jpeg,image/png"></label>
<label><input id="confirm" type="checkbox" required> 두 사진의 촬영 방향·자세·카메라 높이와 거리가 비교 가능한지 확인했습니다.</label>
<p class="muted">측면 각도 비교에는 양쪽 측면 사진이 필요합니다. 사진은 이 로컬 서버에서 처리하며 이 화면은 사진·결과를 보관하지 않습니다.</p>
<button id="submit">측정값 비교하기</button><p id="message" role="status" aria-live="polite"></p></form>
<section id="result" hidden><h2>사진상 측정값 차이</h2><p id="summary"></p><div class="scroll"><table><thead><tr><th>항목</th><th>현재</th><th>목표</th><th>현재−목표</th></tr></thead><tbody id="rows"></tbody></table></div><p id="limitations"></p><p class="muted">운동 우선 부위·맞춤 루틴은 아직 제공하지 않습니다.</p></section>
<script>
const form=document.querySelector('#form'),button=document.querySelector('#submit'),message=document.querySelector('#message');
form.addEventListener('submit',async event=>{
 event.preventDefault();button.disabled=true;message.textContent='두 사진을 차례로 분석하고 있습니다…';document.querySelector('#result').hidden=true;
 try{
  const data=new FormData();
  for(const key of ['current_front','goal_front','current_side','goal_side']){
   const file=form.elements[key].files[0];if(file){if(file.size>10*1024*1024)throw Error('각 사진은 10MB 이하로 선택하세요.');data.append(key,file);}
  }
  data.append('capture_conditions_confirmed',String(document.querySelector('#confirm').checked));
  const response=await fetch('/v1/compare',{method:'POST',body:data});const body=await response.json();
  if(!response.ok){const d=body.detail;throw Error((d?.input?`${d.input==='goal'?'목표':'현재'} 사진: `:'')+(d?.message||'요청을 확인하고 다시 시도하세요.'));}
  const comparison=body.goal_comparison,rows=document.querySelector('#rows');rows.replaceChildren();
  const format=(v,u)=>v===null?'측정 안 됨':`${v.toFixed(2)}${u==='deg'?'°':'배'}`;
  for(const item of comparison.items){const tr=document.createElement('tr');for(const text of [item.title,format(item.current_value,item.unit),format(item.goal_value,item.unit),format(item.delta_current_minus_goal,item.unit)]){const td=document.createElement('td');td.textContent=text;tr.append(td);}rows.append(tr);}
  document.querySelector('#summary').textContent=comparison.summary;document.querySelector('#limitations').textContent=comparison.limitations.join(' ');document.querySelector('#result').hidden=false;message.textContent='비교가 완료됐습니다.';
 }catch(error){message.textContent=error.message||'연결을 확인하고 다시 시도하세요.';}finally{button.disabled=false;}
});
</script></main></html>
