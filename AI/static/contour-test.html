<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOVID · 실험용 상완 분석</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui;background:#f3f6ff;color:#202b40;margin:0}main{max-width:850px;margin:40px auto;padding:24px}.card{background:white;border:1px solid #dce4f4;border-radius:22px;padding:28px;margin:20px 0}button{border:0;border-radius:12px;padding:14px 24px;color:white;background:#4361ee;font:inherit;cursor:pointer}button:disabled{opacity:.5}input{font:inherit}img{max-height:300px;max-width:100%;display:block;margin:20px auto}.tag{color:#4361ee;font-weight:bold}h1{font-size:30px}#candidate{font-size:28px;font-weight:bold}#message{white-space:pre-wrap}small{color:#647088}.bar{height:10px;border-radius:10px;background:#e9eeff}.fill{height:100%;background:#6279ed;border-radius:10px}label{display:block;margin:20px 0}a{color:#4361ee}</style><main><span class="tag">MOVID · EXPERIMENT</span><h1>사진상 상완 윤곽 분석</h1><p>피부가 보이는 상완을 잘라 올리면 학습된 실험 모델의 참고 후보를 확인할 수 있습니다.</p><section class="card"><form id="form"><label>상완 JPG / PNG <input id="image" name="image" type="file" accept="image/jpeg,image/png" required></label><img id="preview" alt="선택한 상완" hidden><label><input id="confirmed" type="checkbox" required> 부적절한 노출이나 의복 가림이 없는 상완 크롭인지 직접 확인했습니다.</label><button id="run">분석하기</button></form><p id="message" role="status"></p></section><section id="result" class="card" hidden><span id="status" class="tag"></span><p id="candidate"></p><div id="scores"></div><p id="score"></p><small>모델 점수는 실제 정확도가 아닙니다. 참고 후보가 표시돼도 보류 상태일 수 있습니다. 근육량·근력·건강·체형 점수는 측정하지 않습니다.</small></section><p><small>소량의 사람 검수 라벨로 만든 두 등급 초기 실험입니다. 별도 외부 시험으로 검증하지 않았습니다. 자동 의복·부적절한 내용 검출 기능은 없습니다.</small></p><a href="/">전신 기울기·비율 측정으로 이동</a></main><script>
const q=s=>document.querySelector(s);let previewURL;const names={clear:'뚜렷함',medium:'중간',weak:'약함'};
q('#image').onchange=()=>{if(previewURL)URL.revokeObjectURL(previewURL);const f=q('#image').files[0];q('#preview').hidden=!f;if(f){previewURL=URL.createObjectURL(f);q('#preview').src=previewURL}q('#confirmed').checked=false;q('#result').hidden=true};
q('#form').onsubmit=async e=>{e.preventDefault();q('#run').disabled=true;q('#message').textContent='분석 중입니다…';q('#result').hidden=true;try{const f=new FormData();f.append('image',q('#image').files[0]);f.append('skin_visible_confirmed','true');const response=await fetch('/v1/contour/classify',{method:'POST',body:f});const data=await response.json();if(!response.ok)throw new Error(data.detail?.message||'분석을 완료하지 못했습니다. 서버 설정과 사진을 확인하세요.');const c=data.classification;q('#status').textContent=c.status==='abstained'?'판정 보류 · 실험 결과':'실험 결과 · 독립 검증 전';q('#candidate').textContent='참고 후보: '+(names[c.candidate_label]||c.candidate_label);q('#score').textContent='후보 모델 점수 '+(100*c.model_score).toFixed(1)+'%';q('#scores').replaceChildren();for(const [key,value] of Object.entries(c.probabilities)){const item=document.createElement('p');item.textContent=(names[key]||key)+' · '+(100*value).toFixed(1)+'%';const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='fill';fill.style.width=Math.min(100,Math.max(0,100*value))+'%';bar.append(fill);q('#scores').append(item,bar)}q('#result').hidden=false;q('#message').textContent='분석 요청 완료'}catch(error){q('#message').textContent=error.message}finally{q('#run').disabled=false}};
</script></html>
