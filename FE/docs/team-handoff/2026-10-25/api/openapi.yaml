  # ==============================================================================
  # coach - AI 코치
  # ==============================================================================
  # /api/ai/chat   [POST=2차,GET=2차]
  /api/ai/chat:
    post:
      tags:
      - coach
      operationId: askCoach
      summary: AI 코치에게 질문
      description: |-
        **단계: 2차**

        - 최근 7일 운동 기록, 최신 분석, 목표, 오늘 루틴을 근거로 답한다. 응답은 동기이며 최대 30초.
        - 의학적 진단·처방 표현은 하지 않는다. 통증 관련 질문에는 전문의 상담을 권하는 문장을 붙인다.
        - `AI_UNAVAILABLE`(502)이 나면 질문은 저장하지 않고 횟수도 차감하지 않는다.
        - 루틴을 바꾸는 것이 좋다고 판단하면 `suggestion`을 함께 준다. 실제 반영은 `confirm`을 호출해야만 일어난다.
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              content: 스쿼트 할 때 무릎이 아픈데 계속해도 되나요?
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              example:
                user_message:
                  message_id: 501
                  role: user
                  content: 스쿼트 할 때 무릎이 아픈데 계속해도 되나요?
                  created_at: '2026-10-06T19:02:10+09:00'
                  suggestion: null
                reply:
