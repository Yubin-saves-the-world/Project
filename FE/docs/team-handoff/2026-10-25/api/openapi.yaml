  /api/auth/oauth/kakao:
    post:
      tags:
      - auth
      operationId: loginKakao
      summary: 카카오 로그인
      description: |-
        **단계: 2차**

        - 앱이 카카오 SDK로 받은 **액세스 토큰**을 보내면 서버가 카카오 서버에 직접 물어 확인한다: ① `GET /v1/user/access_token_info`로 `app_id`가 우리 앱과 같은지(다른 앱에서 받은 토큰을 막는다) ② `GET /v2/user/me`로 회원번호(`id`)·닉네임·이메일을 받는다. 하나라도 실패하면 `OAUTH_FAILED`.
        - 카카오 회원번호(`id`, 숫자)로 계정을 찾는다. 있으면 그 계정으로 로그인한다(`is_new_user=false`, 동의 값은 무시). 없으면 계정을 새로 만든다(`is_new_user=true`).
        - 신규일 때는 동의 4개가 모두 `true`여야 한다. 아니면 `TERMS_REQUIRED`이고, 앱은 동의 화면을 보여 준 뒤 같은 토큰이 만료 전이면 다시 보낸다.
        - **카카오는 이메일을 안 줄 수 있다**(사용자가 동의 항목을 거부하거나 앱에 이메일 동의 항목이 없을 때). 이메일이 없으면 `email=null`로 계정을 만든다. 이 계정은 이메일 로그인과 비밀번호 재설정을 쓸 수 없고, 앱은 `GET /users/me`의 `email`이 null일 수 있다고 가정해야 한다.
        - 카카오가 이메일을 주고(`is_email_valid`·`is_email_verified`가 모두 `true`) 같은 이메일로 이메일 가입한 계정이 이미 있으면 자동으로 합치지 않고 `EMAIL_DUPLICATED`로 안내한다(계정 탈취 방지). 인증되지 않은 이메일은 없는 것으로 본다.
        - 닉네임이 없으면 카카오 프로필 닉네임으로 만들고 겹치면 숫자를 붙인다. 비밀번호가 없는 계정이라 비밀번호 재설정은 `204`만 주고 메일은 보내지 않는다.
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoLoginRequest'
            example:
              access_token: kakao_example_access_token
              nickname: 지한
              terms_agreed: true
              privacy_agreed: true
              body_photo_agreed: true
              ai_processing_agreed: true
              policy_version: '2026-10-01'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaoTokenResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiJ9.example.signature
                token_type: Bearer
                expires_in: 604800
                onboarding_completed: false
                is_new_user: false
        '400':
          description: VALIDATION_FAILED / TERMS_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 요청 형식·범위·필수값 오류. `fields`에 항목별 사유
                  value:
                    code: VALIDATION_FAILED
                    message: 입력값을 확인해 주세요.
                    status: 400
                    fields:
                    - field: password
                      reason: 8자 이상 영문+숫자 조합이어야 합니다.
                TERMS_REQUIRED:
                  summary: 가입 때 동의 4개 중 하나라도 false
                  value:
                    code: TERMS_REQUIRED
                    message: 필수 약관에 모두 동의해 주세요.
                    status: 400
        '401':
