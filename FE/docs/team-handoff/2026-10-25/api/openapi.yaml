  # ==============================================================================
  # /api/photos   [POST=MVP,GET=MVP,DELETE=MVP]
  /api/photos:
    post:
      tags:
      - photo
      operationId: uploadPhoto
      summary: 사진 업로드
      description: |-
        **단계: MVP**

        - 앱은 업로드 전에 긴 변을 1024px 이하로 줄이고, **촬영 방향(EXIF 회전)을 픽셀에 반영해서** JPG로 보낸다. 반영하지 않으면 사진이 옆으로 누운 채 분석되어 `NO_PERSON`·`NOT_FULL_BODY`가 나올 수 있다. 서버도 10MB를 넘으면 거부한다.
        - 확장자가 아니라 **파일 내용(매직 바이트)**으로 JPG·PNG를 판별한다.
        - 사용자당 최대 20장 (`PHOTO_LIMIT_EXCEEDED`). 사진은 비공개 저장소에 두고 `url`은 서명 URL(1시간)로 준다.
        - `body_photo` 동의를 철회한 사용자는 `CONSENT_REQUIRED`.
        - **목표 사진(`type=goal`)은 임시 파일이다.** 업로드 후 1시간 안에 `POST /goal-bodies`로 등록하지 않으면 서버가 삭제하고, 등록하면 AI가 특징을 뽑은 직후(성공·실패 모두) 삭제한다.
      x-phase: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: JPG 또는 PNG, 10MB 이하
                type:
                  type: string
                  enum:
                  - current
                  - goal
                  description: current 현재 체형 / goal 목표 체형
                side:
                  type: string
