                target_id: 100
                reason: spam
                detail: 광고성 글이에요.
                reporter_id: 15
                status: resolved
                created_at: '2026-10-06T19:02:10+09:00'
        '400':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 요청 형식·범위·필수값 오류. `fields`에 항목별 사유
                  value:
                    code: VALIDATION_FAILED
                    message: 입력값을 확인해 주세요.
                    status: 400
                    fields:
                    - field: password
                      reason: 8자 이상 영문+숫자 조합이어야 합니다.
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  summary: 토큰 없음·만료·변조. 앱은 토큰을 지우고 로그인 화면으로
                  value:
                    code: UNAUTHORIZED
                    message: 로그인이 필요해요.
                    status: 401
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  summary: 관리자 전용, 남의 게시글·댓글 수정·삭제
                  value:
                    code: FORBIDDEN
                    message: 권한이 없어요.
                    status: 403
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NOT_FOUND:
                  summary: 대상 없음. 남의 데이터도 동일하게 404
                  value:
                    code: NOT_FOUND
                    message: 찾을 수 없어요.
                    status: 404

# ==============================================================================
# COMPONENTS
# 공통으로 쓰는 요청/응답 모양(schemas)과 인증 방식
# ==============================================================================
components:

  # --- securitySchemes ---
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # --- schemas ---
  schemas:
    FieldError:
      type: object
      properties:
        field:
          type: string
          description: 문제가 된 필드명
          example: password
        reason:
          type: string
          description: 사유
          example: 8자 이상 영문+숫자 조합이어야 합니다.
      required:
      - field
      - reason
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: 에러 코드 (6장 표)
          example: VALIDATION_FAILED
        message:
          type: string
          description: 사용자에게 그대로 보여줄 수 있는 문장
          example: 입력값을 확인해 주세요.
        status:
          type: integer
          format: int32
          description: HTTP 상태 코드
          example: 400
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: 입력 검증 실패일 때만 값이 있고 나머지는 null
      required:
      - code
      - message
      - status
      - fields
      description: 모든 에러 응답의 공통 형식
    Author:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          description: 작성자 ID
          example: 12
        nickname:
          type: string
          description: 닉네임
          example: 유빈
      required:
      - user_id
      - nickname
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: 이메일 (소문자로 저장·비교)
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 64
          pattern: ^(?=.*[A-Za-z])(?=.*\d).{8,64}$
          description: 8~64자, 영문과 숫자를 각각 1자 이상 포함
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          description: 닉네임
          example: 지한
        terms_agreed:
          type: boolean
          description: 이용약관 동의 (true 필수)
          example: true
        privacy_agreed:
          type: boolean
          description: 개인정보 처리방침 동의 (true 필수)
          example: true
        body_photo_agreed:
          type: boolean
          description: 신체 사진 수집·이용 동의 (true 필수)
          example: true
        ai_processing_agreed:
          type: boolean
          description: AI 분석 처리 동의 (true 필수). 사진·정보가 AI 서버로 전송되는 것에 대한 동의
          example: true
        policy_version:
          type: string
          minLength: 1
          maxLength: 30
          description: 동의한 약관 버전. 생략하면 서버의 현재 버전
          example: '2026-10-01'
        email_verification_token:
          type: string
          description: 이메일 인증번호 확인 응답의 verification_token. 한 번만 쓸 수 있음
          example: Jq3y7m0kGh9XtYb2sP1nQw6vZaR4cLd8eFuTiOoNpMk
      required:
      - email
      - password
      - nickname
      - terms_agreed
      - privacy_agreed
      - body_photo_agreed
      - ai_processing_agreed
      - email_verification_token
    UserCreated:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          description: 회원 ID
          example: 12
        email:
          type: string
          format: email
          maxLength: 255
          description: 이메일
        nickname:
          type: string
          description: 닉네임
          example: 지한
        created_at:
          type: string
          format: date-time
          description: 가입 시각
      required:
      - user_id
      - email
      - nickname
      - created_at
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: 이메일
        password:
          type: string
          minLength: 1
          maxLength: 64
          description: 비밀번호
          example: abcd1234
      required:
      - email
      - password
    GoogleLoginRequest:
      type: object
      properties:
        id_token:
          type: string
          description: 앱이 `google_sign_in`으로 받은 구글 ID 토큰. 서버는 이 토큰만 검증한다
          example: eyJhbGciOiJSUzI1NiJ9.example.signature
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          description: 신규 가입일 때만 사용. 생략하면 서버가 구글 이름에서 만든다
          example: 지한
        terms_agreed:
          type: boolean
          description: 신규 가입일 때 true 필수 (기존 회원이면 무시)
          example: true
        privacy_agreed:
          type: boolean
          description: 신규 가입일 때 true 필수
          example: true
        body_photo_agreed:
          type: boolean
          description: 신규 가입일 때 true 필수
          example: true
        ai_processing_agreed:
          type: boolean
          description: 신규 가입일 때 true 필수
          example: true
        policy_version:
          type: string
          minLength: 1
          maxLength: 30
          description: 동의한 약관 버전
          example: '2026-10-01'
      required:
      - id_token
    GoogleTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT
          example: eyJhbGciOiJIUzI1NiJ9.example.signature
        token_type:
          type: string
          enum:
          - Bearer
          description: 항상 Bearer
        expires_in:
          type: integer
          format: int32
          description: 만료까지 남은 초 (7일)
          example: 604800
        onboarding_completed:
          type: boolean
          description: false면 신체정보 입력 화면으로
          example: false
        is_new_user:
          type: boolean
          description: 이번 호출로 계정이 새로 만들어졌는지
          example: false
      required:
      - access_token
      - token_type
      - expires_in
      - onboarding_completed
      - is_new_user
    KakaoLoginRequest:
      type: object
      properties:
        access_token:
          type: string
          description: 앱이 카카오 SDK(`kakao_flutter_sdk_user`)로 받은 카카오 액세스 토큰. 서버는 이 토큰만 검증한다
          example: kakao_example_access_token
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          description: 신규 가입일 때만 사용. 생략하면 서버가 카카오 프로필 닉네임에서 만든다
          example: 지한
        terms_agreed:
          type: boolean
          description: 신규 가입일 때 true 필수 (기존 회원이면 무시)
          example: true
        privacy_agreed:
          type: boolean
          description: 신규 가입일 때 true 필수
          example: true
        body_photo_agreed:
          type: boolean
          description: 신규 가입일 때 true 필수
          example: true
        ai_processing_agreed:
          type: boolean
          description: 신규 가입일 때 true 필수
          example: true
        policy_version:
          type: string
          minLength: 1
          maxLength: 30
          description: 동의한 약관 버전
          example: '2026-10-01'
      required:
      - access_token
    KakaoTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: 우리 서버의 JWT (카카오 토큰이 아님)
          example: eyJhbGciOiJIUzI1NiJ9.example.signature
        token_type:
          type: string
          enum:
          - Bearer
          description: 항상 Bearer
        expires_in:
          type: integer
          format: int32
          description: 만료까지 남은 초 (7일)
          example: 604800
        onboarding_completed:
          type: boolean
          description: false면 신체정보 입력 화면으로
          example: false
        is_new_user:
          type: boolean
          description: 이번 호출로 계정이 새로 만들어졌는지
          example: false
      required:
      - access_token
      - token_type
      - expires_in
      - onboarding_completed
      - is_new_user
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT. 이후 요청의 Authorization 헤더에 사용
          example: eyJhbGciOiJIUzI1NiJ9.example.signature
        token_type:
          type: string
          enum:
          - Bearer
          description: 항상 Bearer
        expires_in:
          type: integer
          format: int32
          description: 만료까지 남은 초 (7일)
          example: 604800
        onboarding_completed:
          type: boolean
          description: false면 앱이 홈 대신 신체정보 입력 화면으로 이동
          example: false
      required:
      - access_token
      - token_type
      - expires_in
      - onboarding_completed
    UserMe:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          description: 회원 ID
          example: 12
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 255
          description: 이메일. 카카오로 가입하고 이메일 제공에 동의하지 않았으면 null
        nickname:
          type: string
          description: 닉네임
          example: 지한
        role:
          type: string
          enum:
          - user
          - admin
          description: 권한
        onboarding_completed:
          type: boolean
          description: 신체정보 입력 완료 여부
        consent_completed:
          type: boolean
          description: 필수 동의 4종(약관·개인정보·사진·AI 처리)이 모두 true인지
        body_photo_agreed:
          type: boolean
          description: 사진 동의 상태. false면 앱이 사진 업로드를 막고 설정으로 안내
        ai_processing_agreed:
          type: boolean
          description: AI 처리 동의 상태. false면 AI 분석·코치 요청을 막고 설정으로 안내
        created_at:
          type: string
          format: date-time
          description: 가입 시각
      required:
      - user_id
      - email
      - nickname
      - role
      - onboarding_completed
      - consent_completed
      - body_photo_agreed
      - ai_processing_agreed
      - created_at
    UserPatch:
      type: object
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          description: 새 닉네임
          example: 지한
        terms_agreed:
          type: boolean
          description: true만 허용 (철회는 회원 탈퇴)
          example: true
        privacy_agreed:
          type: boolean
          description: true만 허용
          example: true
        body_photo_agreed:
          type: boolean
          description: true 동의 / false 철회
          example: true
        ai_processing_agreed:
          type: boolean
          description: true 동의 / false 철회
          example: true
      description: 1개 이상 필수. 아무것도 없으면 VALIDATION_FAILED
    EmailCodeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: 인증번호를 받을 이메일
      required:
      - email
    EmailCodeConfirmRequest:
