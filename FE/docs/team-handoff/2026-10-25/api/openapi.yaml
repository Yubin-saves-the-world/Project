  # /api/workout-logs/{log_id}/complete   [PATCH=MVP]
  /api/workout-logs/{log_id}/complete:
    patch:
      tags:
      - workout
      operationId: completeWorkout
      summary: 운동 종료
      description: |-
        **단계: MVP**

        - `completed_at`을 지금으로 정하고, `duration_sec`은 요청값(없으면 `completed_at − started_at`)으로 확정한다. 요청값이 경과 시간보다 크면 경과 시간으로 보정한다.
        - `is_done=true`인 세트가 0개면 `WORKOUT_EMPTY` (앱은 이때 `DELETE /workout-logs/{log_id}`로 기록을 지운다).
        - `total_volume_kg` = 완료 세트의 `weight_kg × reps` 합.
        - 루틴에서 시작한 기록이면 `routine_progress`를 계산하고, **루틴의 모든 종목이 종료되면 루틴 `status`를 `done`으로 바꾼다.**
      x-phase: 1
      parameters:
      - name: log_id
        in: path
        required: true
        description: 운동 기록 ID
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutCompleteRequest'
            example:
              duration_sec: 1044
              memo: 하체 컨디션 좋음
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutCompleted'
              example:
                log_id: 87
