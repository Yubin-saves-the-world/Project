        **단계: MVP**

        - 즉시 로그인이 불가능해야 하고, 이메일·닉네임·신체정보·사진 원본·분석·운동 기록 등 개인정보를 삭제한다 (Google Play 계정 삭제 요건).
        - 토큰은 7일짜리 JWT라서, **모든 요청에서 탈퇴한 회원인지 확인해 `UNAUTHORIZED`로 막는다.** 토큰이 아직 만료되지 않았어도 탈퇴 직후 접근이 끊겨야 한다.
        - 사진 원본은 저장소(S3)에서 실제로 지운 것을 확인한 뒤 완료로 본다. 지우지 못한 파일은 접근을 막은 채 재시도하고, 24시간 안에 지우는 것을 목표로 한다.
        - 같은 이메일로 다시 가입할 수 있어야 한다.
        - 작성한 게시글·댓글은 작성자 표시를 "탈퇴한 사용자"로 바꾸고 남길지, 함께 삭제할지 정해야 한다 (7장 결정 ⑨).
      x-phase: 1
      responses:
        '204':
          description: 성공 (본문 없음)
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  summary: 토큰 없음·만료·변조. 앱은 토큰을 지우고 로그인 화면으로
                  value:
                    code: UNAUTHORIZED
                    message: 로그인이 필요해요.
                    status: 401

  # /api/auth/password/reset-request   [POST=2차]
  /api/auth/password/reset-request:
    post:
      tags:
      - auth
      operationId: requestPasswordReset
      summary: 비밀번호 재설정 인증번호 요청
      description: |-
        **단계: 2차**

        - 가입 여부와 관계없이 항상 `204` (계정 존재 여부 노출 방지). 응답 시간도 같도록 메일은 비동기로 보낸다.
        - 가입된 이메일 계정이면 6자리 인증번호를 메일로 보낸다. 5분 동안 유효하다. 구글·카카오 계정은 비밀번호가 없어 메일을 보내지 않는다.
        - 같은 이메일은 60초에 한 번, 1시간에 5번까지 보낸다. 넘으면 새 메일 없이 `204`만 반환한다.
        - **메일 발송 수단(SMTP/SES)이 필요하다.** 개발 환경에서는 서버 로그에 번호를 남긴다.
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              email: user@example.com
      responses:
        '204':
          description: 성공 (본문 없음)
        '400':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 요청 형식·범위·필수값 오류. `fields`에 항목별 사유
                  value:
                    code: VALIDATION_FAILED
                    message: 입력값을 확인해 주세요.
                    status: 400
                    fields:
                    - field: password
                      reason: 8자 이상 영문+숫자 조합이어야 합니다.

  # /api/auth/password/reset-verification   [POST=2차]
  /api/auth/password/reset-verification:
    post:
      tags:
      - auth
      operationId: verifyPasswordReset
      summary: 비밀번호 재설정 인증번호 확인
      description: |-
        **단계: 2차**

        - 번호가 맞으면 일회용 `reset_token`(30분 유효)을 준다. 앱은 이 값을 `PATCH /auth/password/reset`의 `token`에 넣는다.
        - 5회 틀리면 `EMAIL_CODE_LOCKED`이고 인증번호를 다시 받아야 한다. 가입되지 않은 이메일이나 요청한 적이 없는 경우도 `EMAIL_CODE_EXPIRED`로 같게 응답한다.
        - 새 토큰을 발급하면 이전에 발급한 미사용 토큰은 무효가 된다.
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetVerify'
            example:
              email: user@example.com
              code: '482916'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetToken'
              example:
                reset_token: L7pA0SDs50jhG5dR8yl6uEGAF2XSQE67MDalR6UJkfI
                expires_in: 1800
        '400':
          description: VALIDATION_FAILED / EMAIL_CODE_INVALID / EMAIL_CODE_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 요청 형식·범위·필수값 오류. `fields`에 항목별 사유
                  value:
                    code: VALIDATION_FAILED
                    message: 입력값을 확인해 주세요.
                    status: 400
                    fields:
                    - field: password
                      reason: 8자 이상 영문+숫자 조합이어야 합니다.
                EMAIL_CODE_INVALID:
                  summary: 인증번호 불일치 (5회까지 재입력)
                  value:
                    code: EMAIL_CODE_INVALID
                    message: 인증번호가 일치하지 않아요.
                    status: 400
                EMAIL_CODE_EXPIRED:
                  summary: 5분 경과 또는 요청 기록 없음
                  value:
                    code: EMAIL_CODE_EXPIRED
                    message: 인증번호가 만료됐어요. 다시 받아 주세요.
                    status: 400
        '429':
          description: EMAIL_CODE_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_CODE_LOCKED:
                  summary: 인증번호 5회 오류
                  value:
                    code: EMAIL_CODE_LOCKED
                    message: 입력 횟수를 초과했어요. 인증번호를 다시 받아 주세요.
                    status: 429

  # /api/auth/password/reset   [PATCH=2차]
  /api/auth/password/reset:
    patch:
      tags:
      - auth
      operationId: resetPassword
      summary: 비밀번호 재설정
      description: |-
        **단계: 2차**

        - 성공하면 해당 토큰을 폐기하고 같은 회원의 다른 미사용 토큰도 함께 폐기한다. 이미 발급된 로그인 토큰은 만료를 기다린다.
        - 새 비밀번호는 회원가입과 같은 규칙(8~64자, 영문+숫자)이다. 규칙을 어기면 `VALIDATION_FAILED`이고 토큰은 소모되지 않는다.
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
            example:
              token: L7pA0SDs50jhG5dR8yl6uEGAF2XSQE67MDalR6UJkfI
              new_password: abcd1234
      responses:
        '204':
          description: 성공 (본문 없음)
        '400':
          description: VALIDATION_FAILED / RESET_TOKEN_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 요청 형식·범위·필수값 오류. `fields`에 항목별 사유
                  value:
                    code: VALIDATION_FAILED
                    message: 입력값을 확인해 주세요.
                    status: 400
                    fields:
                    - field: password
                      reason: 8자 이상 영문+숫자 조합이어야 합니다.
                RESET_TOKEN_INVALID:
                  summary: 재설정 토큰 무효·만료(30분)·이미 사용
                  value:
                    code: RESET_TOKEN_INVALID
                    message: 비밀번호 재설정이 만료되었거나 올바르지 않아요. 처음부터 다시 진행해 주세요.
                    status: 400

