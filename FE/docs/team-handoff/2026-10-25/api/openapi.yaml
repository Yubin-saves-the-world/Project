        '400':
          description: VALIDATION_FAILED / TERMS_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 요청 형식·범위·필수값 오류. `fields`에 항목별 사유
                  value:
