        - **이메일 가입·로그인이 MVP이고, 구글·카카오 로그인은 2차에서 추가한다(ADR-0004).** 이 API는 구글용이고, 카카오는 `POST /auth/oauth/kakao`다.
        - 앱이 `google_sign_in`으로 받은 ID 토큰을 보내면 서버가 구글 공개키로 서명·만료·`aud`(우리 앱 클라이언트 ID)·`email_verified`를 검증한다. 인가 코드 교환은 하지 않는다.
