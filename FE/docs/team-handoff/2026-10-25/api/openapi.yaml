# ==============================================================================
# Project Vitality API 계약서 (OpenAPI 3.1)
#
# 이 파일은 api/gen 에서 자동 생성됩니다. 직접 수정하지 말고 api/gen 을 고친 뒤 build_all.py 를 실행하세요.
# 읽기 편한 문서는 같은 폴더의 API명세서.html, 기능명세서.html 을 보세요.
#
# 전체 100개 = MVP 37 · 2차 37 · 확장 26
#
# 구성:  info/servers/tags  ->  paths (태그별 구역)  ->  components (schemas, responses ...)
# 단계 표시: 각 API 의 x-phase  1=MVP  2=2차  3=확장
# ==============================================================================

# ---- 목차 (METHOD 경로 : 설명 [단계]) ----
#
# [auth] 회원 · 인증
#   POST   /api/users : 회원가입 [MVP]
#   POST   /api/auth/email-verifications : 이메일 인증번호 보내기 [MVP]
#   POST   /api/auth/email-verifications/confirm : 이메일 인증번호 확인 [MVP]
#   POST   /api/auth/login : 이메일 로그인 [MVP]
#   POST   /api/auth/oauth/google : 구글 로그인 [2차]
#   POST   /api/auth/oauth/kakao : 카카오 로그인 [2차]
#   POST   /api/auth/logout : 로그아웃 [MVP]
#   GET    /api/users/me : 내 정보 조회 [MVP]
#   PATCH  /api/users/me : 내 정보 수정 [MVP]
#   DELETE /api/users/me : 회원 탈퇴 [MVP]
#   POST   /api/auth/password/reset-request : 비밀번호 재설정 인증번호 요청 [2차]
#   POST   /api/auth/password/reset-verification : 비밀번호 재설정 인증번호 확인 [2차]
#   PATCH  /api/auth/password/reset : 비밀번호 재설정 [2차]
#
# [profile] 신체정보 · 설문
#   POST   /api/users/me/profile : 신체정보 등록 [MVP]
#   GET    /api/users/me/profile : 신체정보 조회 [MVP]
#   PATCH  /api/users/me/profile : 신체정보 수정 [MVP]
#   GET    /api/users/me/profile/history : 신체정보 이력 [2차]
#   GET    /api/users/me/allergies : 알레르기 목록 [2차]
#   POST   /api/users/me/allergies : 알레르기 등록 [2차]
#   DELETE /api/users/me/allergies/{allergy_id} : 알레르기 삭제 [2차]
#
# [photo] 사진
#   POST   /api/photos : 사진 업로드 [MVP]
#   GET    /api/photos : 사진 목록 [MVP]
#   DELETE /api/photos : 사진 전체 삭제 [MVP]
#   DELETE /api/photos/{photo_id} : 사진 삭제 [MVP]
#
# [analysis] 체형 분석
#   POST   /api/body-analyses/photo : 사진 체형 분석 요청 [MVP]
#   POST   /api/body-analyses/text : 글 체형 분석 요청 [2차]
#   GET    /api/body-analyses/{analysis_id} : 분석 결과 조회 [MVP]
#   GET    /api/body-analyses : 분석 기록 목록 [MVP]
#   GET    /api/body-analyses/usage : 분석 남은 횟수 [MVP]
#
# [goal] 목표 체형
#   POST   /api/goal-bodies : 목표 체형 등록 [MVP]
#   GET    /api/goal-bodies : 목표 체형 조회 [MVP]
#   PATCH  /api/goal-bodies/{goal_body_id} : 목표 체형 수정 [MVP]
#   DELETE /api/goal-bodies/{goal_body_id} : 목표 체형 삭제 [MVP]
#
# [routine] 운동 · 루틴
#   GET    /api/exercises : 운동 목록 [MVP]
#   GET    /api/exercises/{exercise_id} : 운동 상세 [MVP]
#   POST   /api/routines : 맞춤 루틴 생성 [MVP]
#   GET    /api/routines/weekly : 주간 루틴 조회 [MVP]
#   GET    /api/routines/today : 오늘의 루틴 [MVP]
#   GET    /api/routines/{routine_id} : 루틴 상세 [MVP]
#   PATCH  /api/routines/{routine_id} : 루틴 건너뛰기·되돌리기 [2차]
#
# [workout] 운동 기록
#   POST   /api/workout-logs : 운동 시작 (종목 1개) [MVP]
#   GET    /api/workout-logs : 운동 기록 조회 [MVP]
#   GET    /api/workout-logs/stats : 운동 통계 [2차]
#   GET    /api/workout-logs/{log_id} : 운동 기록 상세 [MVP]
#   DELETE /api/workout-logs/{log_id} : 운동 기록 삭제 [MVP]
#   POST   /api/workout-logs/{log_id}/sets : 세트 추가 [MVP]
#   PATCH  /api/workout-logs/{log_id}/sets/{set_id} : 세트 수정 [MVP]
#   DELETE /api/workout-logs/{log_id}/sets/{set_id} : 세트 삭제 [MVP]
#   PATCH  /api/workout-logs/{log_id}/complete : 운동 종료 [MVP]
#   GET    /api/streaks : 연속 운동 기록 [2차]
#
# [correction] 자세 교정
#   GET    /api/correction-exercises : 교정 운동 목록 [2차]
#   GET    /api/correction-exercises/{exercise_id} : 교정 운동 상세 [2차]
#
# [diet] 식단
#   POST   /api/diet-plans : 맞춤 식단 생성 [2차]
#   GET    /api/diet-plans : 날짜별 식단 조회 [2차]
#   GET    /api/diet-plans/{plan_id} : 식단 상세 [2차]
#
# [coach] AI 코치
#   POST   /api/ai/chat : AI 코치에게 질문 [2차]
#   GET    /api/ai/chat : AI 대화 기록 [2차]
#   POST   /api/ai/routine-suggestions/{suggestion_id}/confirm : 루틴 수정 제안 확인 [2차]
#   GET    /api/ai/usage : AI 코치 사용량 [2차]
#
# [community] 커뮤니티
#   GET    /api/posts : 게시글 목록 [2차]
#   POST   /api/posts : 게시글 작성 [2차]
#   GET    /api/posts/{post_id} : 게시글 조회 [2차]
#   PATCH  /api/posts/{post_id} : 게시글 수정 [2차]
#   DELETE /api/posts/{post_id} : 게시글 삭제 [2차]
#   GET    /api/posts/{post_id}/comments : 댓글 목록 [2차]
#   POST   /api/posts/{post_id}/comments : 댓글 작성 [2차]
#   DELETE /api/posts/{post_id}/comments/{comment_id} : 댓글 삭제 [2차]
#   POST   /api/posts/{post_id}/likes : 게시글 좋아요 [2차]
#   DELETE /api/posts/{post_id}/likes : 게시글 좋아요 취소 [2차]
#
# [safety] 신고 · 차단
#   POST   /api/reports : 게시글·댓글 신고 [2차]
#   GET    /api/reports : 내 신고 내역 [2차]
#   POST   /api/blocks/{blocked_user_id} : 사용자 차단 [2차]
#   DELETE /api/blocks/{blocked_user_id} : 차단 해제 [2차]
#   GET    /api/blocks : 차단 목록 [2차]
#
# [misc] 제휴 상품 · 미션 · 할인권 · 알림
#   GET    /api/partner-products : 제휴 상품 목록 [확장]
#   GET    /api/partner-products/{product_id} : 제휴 상품 상세 [확장]
#   GET    /api/missions/current : 현재 미션 [확장]
#   GET    /api/missions/{mission_id}/progress : 미션 진행률 [확장]
#   GET    /api/user-coupons : 내 할인권 목록 [확장]
#   GET    /api/user-coupons/{user_coupon_id} : 내 할인권 상세 [확장]
#   GET    /api/notification-settings : 알림 설정 조회 [확장]
#   PATCH  /api/notification-settings/{type} : 알림 설정 수정 [확장]
#   PUT    /api/users/me/device-token : 푸시 기기 토큰 등록 [확장]
#
# [admin] 관리자
#   GET    /api/admin/users : 회원 목록 [확장]
#   GET    /api/admin/users/{user_id} : 회원 조회 [확장]
#   GET    /api/admin/partners : 제휴사 목록 [확장]
#   POST   /api/admin/partners : 제휴사 등록 [확장]
#   PATCH  /api/admin/partners/{partner_id} : 제휴사 수정 [확장]
#   POST   /api/admin/partner-products : 제휴 상품 등록 [확장]
#   PATCH  /api/admin/partner-products/{product_id} : 제휴 상품 수정 [확장]
#   POST   /api/admin/missions : 미션 등록 [확장]
#   PATCH  /api/admin/missions/{mission_id} : 미션 수정 [확장]
#   POST   /api/admin/coupons : 할인권 등록 [확장]
#   PATCH  /api/admin/coupons/{coupon_id} : 할인권 수정 [확장]
#   POST   /api/admin/exercises : 운동 종목 등록 [확장]
#   PATCH  /api/admin/exercises/{exercise_id} : 운동 종목 수정 [확장]
#   POST   /api/admin/correction-exercises : 교정 운동 등록 [확장]
#   PATCH  /api/admin/correction-exercises/{exercise_id} : 교정 운동 수정 [확장]
#   GET    /api/admin/reports : 신고 목록 [확장]
#   PATCH  /api/admin/reports/{report_id} : 신고 처리 [확장]

openapi: 3.1.0
info:
  title: Project Vitality API
  version: 1.0.0-draft
  description: |-
    앱(Flutter)과 서버(Spring Boot)가 동시에 개발하는 기준 계약서. `api/gen`의 정의에서 생성된 파일이므로 직접 수정하지 않는다.

    - 모든 경로는 `/api` 아래. JSON 필드는 `snake_case`. 시각은 KST `+09:00` ISO 8601.
    - 인증: `Authorization: Bearer {access_token}`. 재발급 API 없음, 만료(7일) 시 재로그인.
    - 단계: `x-phase` 1=MVP(첫 제출 범위), 2=2차(비공개 테스트 기간), 3=확장(이후, 초안).
    - 에러 형식과 코드는 `ErrorResponse`와 각 응답의 examples 참고.
servers:
- url: http://localhost:8080
  description: 로컬 개발 (PC 브라우저·Postman)
- url: http://10.0.2.2:8080
  description: Android 에뮬레이터에서 내 PC의 서버에 접속할 때
- url: /
  description: 배포(같은 도메인)
tags:
- name: auth
  description: 회원 · 인증
- name: profile
  description: 신체정보 · 설문
- name: photo
  description: 사진
- name: analysis
  description: 체형 분석
- name: goal
  description: 목표 체형
- name: routine
  description: 운동 · 루틴
- name: workout
  description: 운동 기록
- name: correction
  description: 자세 교정
- name: diet
  description: 식단
- name: coach
  description: AI 코치
- name: community
  description: 커뮤니티
- name: safety
  description: 신고 · 차단
- name: misc
  description: 제휴 상품 · 미션 · 할인권 · 알림
- name: admin
  description: 관리자
security:
- bearerAuth: []

# ==============================================================================
# PATHS
# 태그(기능 묶음) 순서대로 나열. 구역 제목은 주석이라 도구에는 영향 없음
# ==============================================================================
paths:

  # ==============================================================================
  # auth - 회원 · 인증
  # ==============================================================================
  # /api/users   [POST=MVP]
  /api/users:
    post:
      tags:
      - auth
      operationId: signup
      summary: 회원가입
      description: |-
        **단계: MVP**

        - 가입 전에 이메일 인증을 마쳐야 한다. `POST /auth/email-verifications`로 받은 인증번호를 `POST /auth/email-verifications/confirm`으로 확인하면 `verification_token`을 주고, 이 값을 `email_verification_token`에 넣는다. 토큰이 없거나 다른 이메일의 것이거나 만료·사용됐으면 `EMAIL_NOT_VERIFIED`. 가입에 성공하면 토큰은 폐기된다.
        - 가입만 하고 토큰은 발급하지 않는다. 앱이 이어서 `POST /auth/login`을 호출한다.
        - 이메일은 소문자로 바꿔 저장·비교한다.
        - 동의 4개(`terms_agreed`, `privacy_agreed`, `body_photo_agreed`, `ai_processing_agreed`)가 모두 `true`가 아니면 `TERMS_REQUIRED`. 앱은 사진·AI 동의를 한 체크박스로 묶어 두 값을 함께 보내도 된다.
        - 동의는 종류별(`terms`·`privacy`·`body_photo`·`ai_processing`)로 **약관 버전과 시각을 이력으로 남긴다.** 마지막 기록이 현재 상태이고, 철회해도 이전 기록은 지우지 않는다.
        - 비밀번호는 BCrypt로 해시해 저장하고 응답·로그에 남기지 않는다.
      x-phase: 1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              email: user@example.com
              password: abcd1234
              nickname: 지한
              terms_agreed: true
              privacy_agreed: true
              body_photo_agreed: true
              ai_processing_agreed: true
              policy_version: '2026-10-01'
              email_verification_token: Jq3y7m0kGh9XtYb2sP1nQw6vZaR4cLd8eFuTiOoNpMk
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
              example:
                user_id: 12
                email: user@example.com
                nickname: 지한
                created_at: '2026-10-06T19:02:10+09:00'
        '400':
          description: VALIDATION_FAILED / TERMS_REQUIRED / EMAIL_NOT_VERIFIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 요청 형식·범위·필수값 오류. `fields`에 항목별 사유
                  value:
                    code: VALIDATION_FAILED
                    message: 입력값을 확인해 주세요.
                    status: 400
                    fields:
                    - field: password
                      reason: 8자 이상 영문+숫자 조합이어야 합니다.
                TERMS_REQUIRED:
                  summary: 가입 때 동의 4개 중 하나라도 false
                  value:
                    code: TERMS_REQUIRED
                    message: 필수 약관에 모두 동의해 주세요.
                    status: 400
                EMAIL_NOT_VERIFIED:
                  summary: 가입 요청의 인증 토큰이 없거나 다른 이메일·만료·이미 사용
                  value:
                    code: EMAIL_NOT_VERIFIED
                    message: 이메일 인증을 먼저 완료해 주세요.
                    status: 400
        '409':
          description: EMAIL_DUPLICATED / NICKNAME_DUPLICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_DUPLICATED:
                  summary: 이메일 중복
                  value:
                    code: EMAIL_DUPLICATED
                    message: 이미 가입된 이메일이에요.
                    status: 409
                NICKNAME_DUPLICATED:
                  summary: 닉네임 중복
                  value:
                    code: NICKNAME_DUPLICATED
                    message: 이미 사용 중인 닉네임이에요.
                    status: 409

  # /api/auth/email-verifications   [POST=MVP]
  /api/auth/email-verifications:
    post:
      tags:
      - auth
      operationId: sendEmailCode
      summary: 이메일 인증번호 보내기
      description: |-
        **단계: MVP**

        - 입력한 이메일로 6자리 인증번호를 보낸다. 5분 동안 유효하다.
        - 이미 가입된 이메일이면 번호를 보내지 않고 `EMAIL_DUPLICATED`.
        - 같은 이메일은 60초에 한 번, 1시간에 5번까지 요청할 수 있다. 넘으면 `EMAIL_CODE_TOO_FREQUENT`.
        - 인증번호는 서버가 해시로 저장한다. 메일 발송이 꺼진 개발 환경에서는 서버 로그에 번호를 남긴다.
        - 메일이 스팸함으로 분류될 수 있으므로 앱은 "스팸함도 확인해 주세요"를 안내한다.
      x-phase: 1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
            example:
              email: user@example.com
      responses:
        '204':
          description: 성공 (본문 없음)
        '400':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 요청 형식·범위·필수값 오류. `fields`에 항목별 사유
                  value:
                    code: VALIDATION_FAILED
                    message: 입력값을 확인해 주세요.
                    status: 400
                    fields:
                    - field: password
                      reason: 8자 이상 영문+숫자 조합이어야 합니다.
        '409':
          description: EMAIL_DUPLICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_DUPLICATED:
                  summary: 이메일 중복
                  value:
                    code: EMAIL_DUPLICATED
                    message: 이미 가입된 이메일이에요.
                    status: 409
        '429':
          description: EMAIL_CODE_TOO_FREQUENT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_CODE_TOO_FREQUENT:
                  summary: 같은 이메일 60초 간격 또는 시간당 5회 초과
                  value:
                    code: EMAIL_CODE_TOO_FREQUENT
                    message: 잠시 후에 다시 요청해 주세요.
                    status: 429
        '503':
          description: EMAIL_SEND_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_SEND_FAILED:
                  summary: 메일 서버 오류
                  value:
                    code: EMAIL_SEND_FAILED
                    message: 인증 메일을 보내지 못했어요. 잠시 후 다시 시도해 주세요.
                    status: 503

  # /api/auth/email-verifications/confirm   [POST=MVP]
  /api/auth/email-verifications/confirm:
    post:
      tags:
      - auth
      operationId: confirmEmailCode
      summary: 이메일 인증번호 확인
      description: |-
        **단계: MVP**

