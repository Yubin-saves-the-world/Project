  # /api/workout-logs   [POST=MVP,GET=MVP]
  /api/workout-logs:
    post:
      tags:
      - workout
      operationId: startWorkout
      summary: 운동 시작 (종목 1개)
      description: |-
        **단계: MVP**

        - **종목 하나를 실행할 때마다 기록 1개**를 만든다. 4종목 루틴이면 4번 호출한다.
        - `started_at`은 서버가 기록한다. 앱을 나갔다 오면 `지금 − started_at`으로 경과 시간을 복구한다. `workout_date`는 시작 시각의 KST 날짜이고, 자정을 넘겨도 시작한 날로 센다.
        - 진행 중(`in_progress`) 기록이 **6시간을 넘으면 서버가 `aborted`로 바꾼다.** 중단된 기록은 이어하기·통계·연속 기록에서 제외하고, 같은 종목은 새로 시작한다.
        - 같은 종목의 진행 중(`in_progress`) 기록이 이미 있으면 새로 만들지 않고 그 기록을 **`200`** 으로 반환한다 (`resumed=true`). 새로 만들면 `201`.
        - `routine_id`를 보내면 내 루틴이어야 하고 `exercise_id`가 그 루틴의 종목이어야 한다 (아니면 `VALIDATION_FAILED`).
      x-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutStartRequest'
            example:
              exercise_id: 7
              routine_id: 44
      responses:
        '201':
          description: 새로 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutStarted'
              example:
                log_id: 87
                exercise_id: 7
                routine_id: 44
                started_at: '2026-10-06T19:02:10+09:00'
                status: in_progress
                resumed: false
        '200':
          description: 이미 진행 중인 기록을 그대로 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutStarted'
              example:
                log_id: 87
                exercise_id: 7
                routine_id: 44
                started_at: '2026-10-06T19:02:10+09:00'
                status: in_progress
                resumed: true
        '400':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 요청 형식·범위·필수값 오류. `fields`에 항목별 사유
