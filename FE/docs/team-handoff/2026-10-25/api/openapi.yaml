  # ==============================================================================
  # analysis - 체형 분석
  # ==============================================================================
  # /api/body-analyses/photo   [POST=MVP]
  /api/body-analyses/photo:
    post:
      tags:
      - analysis
      operationId: createPhotoAnalysis
      summary: 사진 체형 분석 요청
      description: |-
        **단계: MVP**

        - **비동기.** 즉시 `202`와 `analysis_id`를 돌려주고, 앱이 `GET /body-analyses/{analysis_id}`를 2초마다 조회한다.
        - 앱은 최대 60초까지 조회하고 그래도 `pending`이면 "잠시 후 다시 확인해 주세요"를 보여준다. 서버는 90초가 지난 `pending`을 `failed`(`AI_TIMEOUT`)로 바꾼다.
        - `photo_id`는 `type=current`·`side=front`, `side_photo_id`는 `type=current`·`side=side`인 내 사진이어야 한다 (아니면 `PHOTO_TYPE_MISMATCH`).
        - `goal_body_id`가 있으면 목표와의 비교(`goal_comparison`)까지 수행한다. 목표 사진은 보관하지 않으므로 **현재 사진과 목표의 특징 요약(`summary`)·설명을 비교**한다. 목표의 `status`가 `done`이 아니면 `GOAL_NOT_READY`.
        - `body_photo`·`ai_processing` 동의 중 하나라도 철회했으면 `CONSENT_REQUIRED`.
        - **사진에 없는 값은 만들지 않는다.** 측면 사진이 없으면 `neck_forward_deg`는 null, 신체가 가려지면 해당 항목을 null로 두고 `measures.unavailable`에 사유를 적는다. 판정 기준이 검증되기 전에는 `judgements.level=unavailable`, `balance_score=null`로 내려간다.
        - 한 사용자당 `pending` 분석은 1건만 허용 (`ANALYSIS_IN_PROGRESS`). 하루 3회 한도(제안)는 `done`·`pending`만 센다. 사진 품질 실패는 세지 않는다.
        - 처리 순서: 사진 품질 검사 → MediaPipe 수치 계산 → (목표가 있으면) Qwen-VL이 현재 사진과 목표 특징 요약을 비교. 분석이 `done`이 되어도 루틴은 자동 생성하지 않고, 앱이 `POST /routines`를 호출한다.
      x-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
            example:
              photo_id: 12
              side_photo_id: 13
              goal_body_id: 4
      responses:
        '202':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
              example:
                analysis_id: 31
                status: pending
                poll_after_ms: 2000
                created_at: '2026-10-06T19:02:10+09:00'
        '400':
          description: VALIDATION_FAILED / PHOTO_TYPE_MISMATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 요청 형식·범위·필수값 오류. `fields`에 항목별 사유
                  value:
                    code: VALIDATION_FAILED
                    message: 입력값을 확인해 주세요.
                    status: 400
                    fields:
                    - field: password
                      reason: 8자 이상 영문+숫자 조합이어야 합니다.
                PHOTO_TYPE_MISMATCH:
                  summary: 분석에 current가 아닌 사진, 목표에 goal이 아닌 사진 등
                  value:
