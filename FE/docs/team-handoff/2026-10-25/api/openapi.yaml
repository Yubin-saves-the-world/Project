        - 신규일 때는 동의 4개가 모두 `true`여야 한다. 아니면 `TERMS_REQUIRED`이고, 앱은 동의 화면을 보여 준 뒤 같은 ID 토큰이 만료 전이면 다시 보낸다.
        - 같은 이메일로 이메일 가입한 계정이 이미 있으면 자동으로 합치지 않고 `EMAIL_DUPLICATED`로 안내한다(계정 탈취 방지). 연결 기능은 필요해지면 따로 정한다.
